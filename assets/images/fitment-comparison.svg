<svg viewBox="0 0 680 314" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart comparing fitment factors by the real pay increase each implies over Basic plus DA at 60 percent. 1.83 gives 12.3 percent, 2.00 gives 22.7 percent, 2.28 gives 39.9 percent, 2.57 gives 57.7 percent, 2.86 gives 75.5 percent."><text x="0" y="18" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Real increase over Basic + DA, by fitment factor</text><text x="0" y="38" font-family="Inter,sans-serif" font-size="12" fill="#5F6C7F">DA at 63% means 1.63 is pure neutralisation — only the excess is a genuine raise</text><text x="0" y="76" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="#1A365D">1.83</text><text x="52" y="76" font-family="Inter,sans-serif" font-size="10.5" fill="#5F6C7F">= 7th CPC real raise</text><rect x="150" y="60" width="410" height="22" rx="4" fill="#EDF2F7"/><rect x="150" y="60" width="63" height="22" rx="4" fill="#2C5282"/><text x="223" y="76" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="#1A365D">+12.3%</text><text x="0" y="122" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="#1A365D">2.00</text><rect x="150" y="106" width="410" height="22" rx="4" fill="#EDF2F7"/><rect x="150" y="106" width="116" height="22" rx="4" fill="#2C5282"/><text x="276" y="122" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="#1A365D">+22.7%</text><text x="0" y="168" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="#B45309">2.28</text><text x="52" y="168" font-family="Inter,sans-serif" font-size="10.5" fill="#5F6C7F">analyst consensus</text><rect x="150" y="152" width="410" height="22" rx="4" fill="#EDF2F7"/><rect x="150" y="152" width="204" height="22" rx="4" fill="#D97706"/><text x="364" y="168" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="#B45309">+39.9%</text><text x="0" y="214" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="#1A365D">2.57</text><text x="52" y="214" font-family="Inter,sans-serif" font-size="10.5" fill="#5F6C7F">same number as 7th CPC</text><rect x="150" y="198" width="410" height="22" rx="4" fill="#EDF2F7"/><rect x="150" y="198" width="296" height="22" rx="4" fill="#2C5282"/><text x="456" y="214" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="#1A365D">+57.7%</text><text x="0" y="260" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="#1A365D">2.86</text><text x="52" y="260" font-family="Inter,sans-serif" font-size="10.5" fill="#5F6C7F">union demand</text><rect x="150" y="244" width="410" height="22" rx="4" fill="#EDF2F7"/><rect x="150" y="244" width="387" height="22" rx="4" fill="#2C5282"/><text x="547" y="260" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="#1A365D">+75.5%</text></svg>