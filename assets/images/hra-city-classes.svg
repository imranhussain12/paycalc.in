<svg viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HRA rates by city class: X class metro cities 30 percent of basic pay, Y class 20 percent, Z class 10 percent."><text x="0" y="18" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">HRA by city class, since 1 January 2024</text><text x="0" y="38" font-family="Inter,sans-serif" font-size="12" fill="#5F6C7F">Restored to the top slab when DA crossed 50%</text><text x="0" y="78" font-family="Inter,sans-serif" font-size="12.5" fill="#1A1A2E">X — metro</text><rect x="170" y="62" width="394" height="24" rx="4" fill="#1A365D"/><text x="574" y="79" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600" fill="#1A365D">30%</text><text x="0" y="118" font-family="Inter,sans-serif" font-size="12.5" fill="#1A1A2E">Y — large city</text><rect x="170" y="102" width="263" height="24" rx="4" fill="#2C5282"/><text x="443" y="119" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600" fill="#1A365D">20%</text><text x="0" y="158" font-family="Inter,sans-serif" font-size="12.5" fill="#1A1A2E">Z — everywhere else</text><rect x="170" y="142" width="131" height="24" rx="4" fill="#7B98BF"/><text x="311" y="159" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600" fill="#1A365D">10%</text><text x="0" y="182" font-family="Inter,sans-serif" font-size="11" fill="#5F6C7F">Minimum HRA: ₹5,400 (X) · ₹3,600 (Y) · ₹1,800 (Z)</text></svg>